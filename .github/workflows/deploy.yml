# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer push waits for the current deploy to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The site address comes from public/CNAME (https://voicebutlerwa.com).
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true # keeps .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
